[package]
name = "project_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["simulator"]
simulator = ["jetbeep_core/simulator"]
force-http-api = []
dev-screen-preview = []

[dependencies]
jetbeep_core = { package = "jetbeep-core", path = "../../lib/rust-libs/jetbeep-core" }
lvgl-dsl = { path = "../../lib/rust-libs/lvgl-dsl" }
log = "0.4"
futures = "0.3"
