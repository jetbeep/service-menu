[package]
name = "project_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[features]
default = ["simulator"]
simulator = ["jetbeep/simulator"]
force-http-api = []
dev-screen-preview = []

[dependencies]
jetbeep = { path = "../../rust/lib/jetbeep-desktop" }
jetbeep-lvgl-dsl = { path = "../../lib/application/jetbeep-lvgl-dsl" }
log = "0.4"
futures = "0.3"
