[package]
name = "project_app"
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jetbeep/service-menu"

[lib]
crate-type = ["rlib"]

[features]
default = ["simulator"]
simulator = ["jetbeep_core/simulator"]
force-http-api = []
dev-screen-preview = []

[dependencies]
lvgl-dsl = { git = "https://github.com/jetbeep/rust-libs.git", branch = "main" }
log = "0.4"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "none")'.dependencies]
jetbeep_core = { package = "jetbeep-core", git = "https://github.com/jetbeep/rust-libs.git", branch = "main", default-features = false, features = ["platform-zephyr"] }

[target.'cfg(not(target_os = "none"))'.dependencies]
jetbeep_core = { package = "jetbeep-core", git = "https://github.com/jetbeep/rust-libs.git", branch = "main", default-features = false, features = ["platform-desktop"] }
